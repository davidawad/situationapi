[package]
name = "situationapi-ucdp"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Reusable Rust client for UCDP GED and Candidate event data"
publish = false

[dependencies]
csv = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
